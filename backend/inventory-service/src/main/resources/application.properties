spring.application.name=inventory-service
server.port=8086

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ordereasy_inventory_db?createDatabaseIfNotExist=true
spring.datasource.username=spring_user
spring.datasource.password=Spring@2024

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.healthcheck.enabled=true
management.endpoints.web.exposure.include=health

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Must be true so data.sql runs AFTER Hibernate has created/updated tables
spring.jpa.defer-datasource-initialization=true

# SQL Init — auto-run data.sql on every startup (INSERT IGNORE keeps it idempotent)
spring.sql.init.mode=always

# Dark Store Selection Configuration
# Primary search radius: find active stores within this distance from user location
darkstore.search.radius.km=5.0
# Fallback radius: used if no stores found within primary radius
darkstore.search.fallback.radius.km=10.0